version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: hairstyle_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hairstyle_recommendation

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hairstyle_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/hairstyle_recommendation
      JWT_SECRET: supersecret_hairstyle_jwt_key_2026
      NODE_ENV: production
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hairstyle_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
